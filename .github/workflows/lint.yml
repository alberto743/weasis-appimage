name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Tool images are pinned by digest (reuse 6, shellcheck v0.10.0, actionlint 1.7.7); bump manually
      - name: REUSE compliance
        run: docker run --rm -v "$PWD:/data" docker.io/fsfe/reuse@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6 lint  # reuse 6

      - name: ShellCheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt docker.io/koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb -x -P SCRIPTDIR scripts/*.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
